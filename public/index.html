<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodBridge</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ec, #eefbf0);
      color: #1d2b1d;
    }
    .container {
      max-width: 900px;
      margin: 100px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #4a5b4a;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #eafbe9;
      color: #1d7a38;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FoodBridge</h1>
    <p>Food waste redistribution system for connecting donors, NGOs, and communities.</p>
    <div class="badge">Server is running</div>
  </div>
</body>
</html>
